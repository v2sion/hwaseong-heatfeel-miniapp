name: Collect nationwide heat-feel ranking

on:
  schedule:
    # (2026-08-10 개편) 30분 → 1시간 간격으로 변경. Vercel Blob Advanced Operations
    # 무료 한도(월 2,000회) 초과 방지 목적. 체감온도는 기상 특성상 1시간 단위 변화라
    # 서비스 품질에 영향이 없고, cron put() 횟수가 절반(월 ~720회)으로 줄어든다.
    - cron: "5 * * * *" # 매시 5분에 실행 (전국 250개 시군구 체감온도 재수집)
  workflow_dispatch: {} # 수동 실행 버튼으로도 테스트 가능

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      # (2026-07-26) 청크 결과를 Vercel Blob 대신 이 러너 메모리(merged.json)에서 직접
      # 누적하고 /api/collect-finalize에 한 번만 넘긴다 - Blob Advanced Operations
      # 무료 한도(월 2,000회) 소진 방지. 이유는 api/collect.js 헤더 주석 참고.
      - name: Collect all chunks, merge locally, finalize once (rate-limit 준수를 위해 청크 사이 딜레이)
        env:
          BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          TOTAL=5
          echo "[]" > merged.json
          for CHUNK in $(seq 0 $((TOTAL - 1))); do
            echo "=== chunk $CHUNK / $TOTAL ==="
            # Vercel 일시적 오류(503 등) 대비 최대 3회 재시도
            for ATTEMPT in 1 2 3; do
              if curl -sf --max-time 30 -X POST "$BASE_URL/api/collect?chunk=$CHUNK&total=$TOTAL" \
                -H "Authorization: Bearer $CRON_SECRET" -o "chunk_$CHUNK.json"; then
                break
              fi
              if [ "$ATTEMPT" -lt 3 ]; then
                echo "chunk $CHUNK attempt $ATTEMPT failed, retrying in 15s..."
                sleep 15
              else
                echo "chunk $CHUNK failed after 3 attempts"
                exit 1
              fi
            done
            cat "chunk_$CHUNK.json"
            echo
            jq -s '.[0] + (.[1].results // [])' merged.json "chunk_$CHUNK.json" > merged_next.json
            mv merged_next.json merged.json
            if [ "$CHUNK" -lt $((TOTAL - 1)) ]; then
              sleep 65
            fi
          done
          echo "=== finalize (누적된 $(jq 'length' merged.json)개 지역) ==="
          jq '{regions: .}' merged.json > finalize_body.json
          # finalize도 동일하게 재시도
          for ATTEMPT in 1 2 3; do
            if curl -sf --max-time 30 -X POST "$BASE_URL/api/collect-finalize" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              --data-binary @finalize_body.json; then
              break
            fi
            if [ "$ATTEMPT" -lt 3 ]; then
              echo "finalize attempt $ATTEMPT failed, retrying in 15s..."
              sleep 15
            else
              echo "finalize failed after 3 attempts"
              exit 1
            fi
          done
          echo
